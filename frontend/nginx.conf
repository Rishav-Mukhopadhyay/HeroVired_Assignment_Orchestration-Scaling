# Frontend web server + "receptionist" (reverse proxy) for the backend APIs.
# The browser only talks to this one address; nginx forwards /api/... calls to the
# right backend by its service name (works in docker-compose AND Kubernetes).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/streaming/ { proxy_pass http://streaming:3002; }
    location /api/admin/     { proxy_pass http://admin:3003; }
    location /api/chat/      { proxy_pass http://chat:3004; }

    # Live chat uses WebSockets, which need these extra "upgrade" headers
    location /socket.io/ {
        proxy_pass http://chat:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else under /api goes to the auth service
    location /api/ { proxy_pass http://auth:3001; }

    # React app: unknown paths (e.g. /login on page refresh) return index.html
    location / { try_files $uri $uri/ /index.html; }
}
